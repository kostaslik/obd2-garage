
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build OBD2 Garage APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Extract project
        run: |
          set -e
          mkdir -p obd2_garage_v06
          unzip -o obd2_garage_v06_ready.zip -d obd2_garage_v06
          test -f obd2_garage_v06/pubspec.yaml

      - name: Generate Android project
        working-directory: obd2_garage_v06
        run: |
          flutter create . --platforms=android

      - name: Restore Android manifest
        run: |
          if [ -f android_manifest.xml ]; then
            cp android_manifest.xml \
              obd2_garage_v06/android/app/src/main/AndroidManifest.xml
          fi

      - name: Get Flutter dependencies
        working-directory: obd2_garage_v06
        run: flutter pub get

      - name: Fix legacy Bluetooth plugin
        shell: bash
        run: |
          set -e

          PLUGIN="$HOME/.pub-cache/hosted/pub.dev/flutter_bluetooth_serial-0.4.0/android"

          if [ ! -f "$PLUGIN/build.gradle" ]; then
            echo "Bluetooth plugin build.gradle not found"
            exit 1
          fi

          export PLUGIN

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          plugin = Path(os.environ["PLUGIN"])
          gradle = plugin / "build.gradle"
          manifest = plugin / "src/main/AndroidManifest.xml"

          text = gradle.read_text()

          text = re.sub(r'\bjcenter\s*\(\s*\)', 'mavenCentral()', text)

          if not re.search(r'^\s*namespace\s+', text, re.M):
              package = None
              if manifest.exists():
                  xml = manifest.read_text()
                  match = re.search(
                      r'<manifest\b[^>]*\bpackage\s*=\s*["\']([^"\']+)',
                      xml
                  )
                  if match:
                      package = match.group(1)

              if not package:
                  package = "io.github.edufolly.flutterbluetoothserial"

              match = re.search(r'\bandroid\s*\{', text)
              if not match:
                  raise SystemExit(
                      "Could not find android { block in Bluetooth plugin"
                  )

              pos = match.end()
              text = (
                  text[:pos]
                  + '\n    namespace "' + package + '"\n'
                  + text[pos:]
              )

          gradle.write_text(text)
          print("Bluetooth plugin Gradle compatibility patch applied.")
          PY

      - name: Build debug APK
        working-directory: obd2_garage_v06
        run: flutter build apk --debug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obd2-garage-debug-apk
          path: obd2_garage_v06/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

