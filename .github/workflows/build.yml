
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o obd2_garage_v06_ready.zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        working-directory: obd2_garage_v06
        run: flutter create . --platforms=android --project-name=obd2_garage

      - name: Apply Android permissions
        working-directory: obd2_garage_v06
        run: cp android_manifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: obd2_garage_v06
        run: flutter pub get

      - name: Build APK
        working-directory: obd2_garage_v06
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obd2-garage-apk
          path: obd2_garage_v06/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

