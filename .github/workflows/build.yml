
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java
        run: java -version

      - name: Extract project
        run: unzip -o obd2_garage_v06_ready.zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Check Flutter and Gradle
        working-directory: obd2_garage_v06
        run: flutter doctor -v

      - name: Generate Android files
        working-directory: obd2_garage_v06
        run: flutter create . --platforms=android --project-name=obd2_garage

      - name: Apply Android permissions
        working-directory: obd2_garage_v06
        run: cp android_manifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: obd2_garage_v06
        run: flutter pub get

      
      - name: Patch Bluetooth plugin
        shell: bash
        run: |
          PLUGIN="$HOME/.pub-cache/hosted/pub.dev/flutter_bluetooth_serial-0.4.0/android/build.gradle"
          MANIFEST="$HOME/.pub-cache/hosted/pub.dev/flutter_bluetooth_serial-0.4.0/android/src/main/AndroidManifest.xml"

          test -f "$PLUGIN"
          test -f "$MANIFEST"

          sed -i 's/jcenter()/mavenCentral()/g' "$PLUGIN"

          python3 - "$PLUGIN" "$MANIFEST" <<'PY'
          import re
          import sys

          gradle_path, manifest_path = sys.argv[1:3]

          with open(manifest_path, encoding="utf-8") as f:
              manifest = f.read()

          match = re.search(
              r'<manifest\b[^>]*\bpackage\s*=\s*["\']([^"\']+)["\']',
              manifest
          )

          if not match:
              sys.exit("ERROR: Cannot determine Bluetooth plugin namespace")

          namespace = match.group(1)

          with open(gradle_path, encoding="utf-8") as f:
              gradle = f.read()

          if not re.search(r'(?m)^\s*namespace\s+[\'"]', gradle):
              gradle, count = re.subn(
                  r'(?m)^(\s*android\s*\{)',
                  lambda m: m.group(1) + '\n    namespace "' + namespace + '"',
                  gradle,
                  count=1
              )
              if count != 1:
                  sys.exit("ERROR: Cannot find android block in plugin build.gradle")

              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(gradle)

          print("Bluetooth namespace configured:", namespace)
          PY

          sed -i "/apply plugin: 'kotlin-android'/i apply plugin: 'com.android.library'" "$PLUGIN"


      - name: Build APK
        working-directory: obd2_garage_v06
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obd2-garage-apk
          path: obd2_garage_v06/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
