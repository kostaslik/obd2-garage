name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    name: Build OBD Garage R56 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Extract and locate project
        shell: bash
        run: |
          set -e
          test -f obd2_garage_v06_ready.zip
          mkdir -p obd2_garage_v06
          unzip -o obd2_garage_v06_ready.zip -d obd2_garage_v06
          if [ -f obd2_garage_v06/pubspec.yaml ]; then
            PROJECT="obd2_garage_v06"
          elif [ -f obd2_garage_v06/obd2_garage_v06/pubspec.yaml ]; then
            PROJECT="obd2_garage_v06/obd2_garage_v06"
          else
            echo "ERROR: pubspec.yaml not found"
            find obd2_garage_v06 -maxdepth 5 -name pubspec.yaml
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT"
      - name: Generate Android project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter create . --platforms=android
      - name: Use repository Dart sources
        shell: bash
        run: |
          set -e
          test -f main.dart
          test -f obd_parser.dart
          mkdir -p "$PROJECT_DIR/lib"
          cp main.dart "$PROJECT_DIR/lib/main.dart"
          cp obd_parser.dart "$PROJECT_DIR/lib/obd_parser.dart"
      - name: Repair Dart source errors
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          project = Path(os.environ["PROJECT_DIR"])
          main = project / "lib" / "main.dart"
          if not main.exists():
              raise SystemExit(f"Missing Dart file: {main}")
          source = main.read_text(encoding="utf-8")
          source = re.sub(
              r'\bawait\s+_connection\?\.dispose\(\)\s*;',
              '_connection?.dispose();',
              source
          )
          start = source.find('  void showCodingInfo(String feature) {')
          end = source.find(
              '  Future<void> disconnect() async {',
              start
          )
          if start < 0 or end < 0:
              raise SystemExit(
                  "Could not locate showCodingInfo; source unchanged."
              )
          replacement = r"""  void showCodingInfo(String feature) {
            const details = '''
          Οι επιλογές coding εξαρτώνται από τις μονάδες FRM/MRS και τον εξοπλισμό του συγκεκριμένου MINI R56.
          Πιθανές ρυθμίσεις φωτισμού:
          • Μεσαία/χαμηλή σκάλα
          • Μεγάλη σκάλα
          • Φώτα θέσης / Angel Eyes
          • Φλας
          • Φώτα φρένων
          • Φώτα ομίχλης
          • Φώτα όπισθεν
          • Φωτισμός πινακίδας
          Υπενθύμιση ζώνης:
          Η διαθεσιμότητα των σχετικών ρυθμίσεων εξαρτάται από τη μονάδα ασφαλείας και τον εξοπλισμό.
          ΣΗΜΑΝΤΙΚΟ:
          Το γενικό ELM327 χρησιμοποιείται εδώ για διαγνωστικά OBD-II. Δεν θεωρούμε ότι υποστηρίζει εγγραφή κωδικοποίησης στις μονάδες MINI/BMW. Δεν πραγματοποιείται καμία αλλαγή coding από αυτή την οθόνη.
          ''';
            showDialog<void>(
              context: context,
              builder: (ctx) => AlertDialog(
                title: Text(feature),
                content: const SingleChildScrollView(
                  child: Text(
                    '$details\\n\\nΚατάσταση: πληροφορίες μόνο. Η εγγραφή coding δεν είναι ενεργή.'
                  ),
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(ctx),
                    child: const Text('Εντάξει'),
                  ),
                ],
              ),
            );
          }
          """
          source = source[:start] + replacement + source[end:]
          main.write_text(source, encoding="utf-8")
          test_file = project / "test" / "widget_test.dart"
          if test_file.exists():
              test_source = test_file.read_text(encoding="utf-8")
              test_source = test_source.replace("MyApp", "ObdApp")
              test_file.write_text(test_source, encoding="utf-8")
          print("Dart source repairs applied.")
          PY
      - name: Restore Android manifest
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f android_manifest.xml ]; then
            cp android_manifest.xml \
              android/app/src/main/AndroidManifest.xml
          fi
      - name: Get dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub get
      - name: Fix Bluetooth plugin compatibility
        shell: bash
        run: |
          set -e
          PLUGIN="$HOME/.pub-cache/hosted/pub.dev/flutter_bluetooth_serial-0.4.0/android"
          if [ ! -f "$PLUGIN/build.gradle" ]; then
            echo "ERROR: Bluetooth plugin not found"
            exit 1
          fi
          export PLUGIN
          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          plugin = Path(os.environ["PLUGIN"])
          gradle = plugin / "build.gradle"
          manifest = plugin / "src/main/AndroidManifest.xml"
          text = gradle.read_text()
          text = re.sub(r'\bjcenter\s*\(\s*\)', 'mavenCentral()', text)
          if not re.search(r'^\s*namespace\s+', text, re.M):
              package = "io.github.edufolly.flutterbluetoothserial"
              if manifest.exists():
                  match = re.search(
                      r'<manifest\b[^>]*\bpackage\s*=\s*["\']([^"\']+)',
                      manifest.read_text()
                  )
                  if match:
                      package = match.group(1)
              match = re.search(r'\bandroid\s*\{', text)
              if not match:
                  raise SystemExit("Android block not found in plugin")
              pos = match.end()
              text = (
                  text[:pos]
                  + '\n    namespace "' + package + '"\n'
                  + text[pos:]
              )
          gradle.write_text(text)
          print("Bluetooth plugin patch applied.")
          PY
      - name: Analyze Dart code
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter analyze --no-pub --no-fatal-infos
      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obd-garage-r56-debug-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
